map $http_x_forwarded_proto $rigmark_forwarded_scheme {
  default $scheme;
  https https;
}

server {
  listen 80;
  server_name _;

  # nginx resolves a literal hostname in proxy_pass once, at startup, and caches
  # the address for the life of the worker. Recreating the api container gives
  # it a new address, and this container then proxies to nothing until it is
  # restarted too — an outage produced by a backend-only deploy. Docker's
  # embedded resolver plus a variable in proxy_pass forces per-request lookup.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $rigmark_api api;

  server_tokens off;
  client_max_body_size 6m;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    # $request_uri, not /api/. With a variable in proxy_pass nginx stops
    # appending the unmatched suffix, so a literal path here would deliver
    # every API call to /api/ with its route silently discarded.
    # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host -- $rigmark_api is assigned the hard-coded Docker service name above and cannot be supplied by a request.
    proxy_pass http://$rigmark_api:8080$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $rigmark_forwarded_scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }

  location = /sitemap.xml {
    # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host -- fixed Docker DNS service, not attacker-controlled input.
    proxy_pass http://$rigmark_api:8080/sitemap.xml;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $rigmark_forwarded_scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }

  location = /robots.txt {
    # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host -- fixed Docker DNS service, not attacker-controlled input.
    proxy_pass http://$rigmark_api:8080/robots.txt;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $rigmark_forwarded_scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }

  location = /llms.txt {
    # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host -- fixed Docker DNS service, not attacker-controlled input.
    proxy_pass http://$rigmark_api:8080/llms.txt;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $rigmark_forwarded_scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }

  location /assets/ {
    include /etc/nginx/rigmark-static-security.conf;
    expires 1y;
    try_files $uri =404;
  }

  # A year is right for /assets/, whose filenames carry a content hash: the URL
  # changes whenever the bytes do. These filenames are stable, so a year meant
  # a year of stale artwork at every edge and in every browser — six redrawn
  # illustrations shipped and none of them appeared, because Cloudflare was
  # still holding copies five days old. Short, with a long stale window, so a
  # deploy shows up on its own instead of needing a cache purge.
  location /images/ {
    include /etc/nginx/rigmark-static-security.conf;
    expires off;
    add_header Cache-Control "public, max-age=300, stale-while-revalidate=604800" always;
    try_files $uri =404;
  }

  # Without an explicit rule the browser's automatic favicon request falls
  # through to the catch-all below, which asks the API to resolve it as a page
  # and logs a 404 on every single page load. A week rather than a year,
  # because this filename is not content-hashed.
  location = /favicon.svg {
    include /etc/nginx/rigmark-static-security.conf;
    expires 7d;
    try_files $uri =404;
  }

  location = /__unsolero_spa/index.html {
    internal;
    include /etc/nginx/rigmark-static-security.conf;
    # Preserve only the bounded SEO policy headers emitted by the trusted
    # route resolver across the X-Accel internal redirect.
    add_header X-Robots-Tag $upstream_http_x_robots_tag always;
    add_header Link $upstream_http_link always;
    expires -1;
    try_files /index.html =500;
  }

  # The API fetches the shell here so it can inject per-route metadata before
  # serving it. Marked noindex: it is a duplicate of every route with none of
  # their titles.
  location = /__unsolero_shell.html {
    include /etc/nginx/rigmark-static-security.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    expires -1;
    try_files /index.html =500;
  }

  location = /index.html {
    internal;
    include /etc/nginx/rigmark-static-security.conf;
    expires -1;
  }

  location / {
    # Replace the complete browser path. A proxy_pass URI in the root-prefix
    # location would append the unmatched suffix (for example "products") and
    # accidentally call /api/v1/public-routeproducts.
    rewrite ^ /api/v1/public-route break;
    # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host,generic.nginx.security.missing-internal.missing-internal -- public SPA route resolver by design; destination is the fixed Docker service and the backend validates X-Original-URI.
    proxy_pass http://$rigmark_api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Forwarded-Proto $rigmark_forwarded_scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    proxy_intercept_errors on;
    # Preserve React's existing NotFoundPage while returning a genuine 404.
    error_page 404 =404 /index.html;
  }
}
