map $http_x_forwarded_proto $rigmark_forwarded_scheme {
  default $scheme;
  https https;
}

server {
  listen 80;
  server_name _;

  server_tokens off;
  client_max_body_size 6m;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $rigmark_forwarded_scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }

  location = /sitemap.xml {
    proxy_pass http://api:8080/sitemap.xml;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $rigmark_forwarded_scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }

  location = /robots.txt {
    proxy_pass http://api:8080/robots.txt;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $rigmark_forwarded_scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }

  location /assets/ {
    include /etc/nginx/rigmark-static-security.conf;
    expires 1y;
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/rigmark-static-security.conf;
    expires -1;
    try_files $uri /index.html;
  }
}
