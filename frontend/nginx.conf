map $http_x_forwarded_proto $rigmark_forwarded_scheme {
  default $scheme;
  https https;
}

server {
  listen 80;
  server_name _;

  server_tokens off;
  client_max_body_size 6m;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $rigmark_forwarded_scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }

  location = /sitemap.xml {
    proxy_pass http://api:8080/sitemap.xml;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $rigmark_forwarded_scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }

  location = /robots.txt {
    proxy_pass http://api:8080/robots.txt;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $rigmark_forwarded_scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }

  location = /llms.txt {
    proxy_pass http://api:8080/llms.txt;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $rigmark_forwarded_scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }

  location /assets/ {
    include /etc/nginx/rigmark-static-security.conf;
    expires 1y;
    try_files $uri =404;
  }

  location /images/ {
    include /etc/nginx/rigmark-static-security.conf;
    expires 1y;
    try_files $uri =404;
  }

  location = /__unsolero_spa/index.html {
    internal;
    include /etc/nginx/rigmark-static-security.conf;
    # Preserve only the bounded SEO policy headers emitted by the trusted
    # route resolver across the X-Accel internal redirect.
    add_header X-Robots-Tag $upstream_http_x_robots_tag always;
    add_header Link $upstream_http_link always;
    expires -1;
    try_files /index.html =500;
  }

  # The API fetches the shell here so it can inject per-route metadata before
  # serving it. Marked noindex: it is a duplicate of every route with none of
  # their titles.
  location = /__unsolero_shell.html {
    include /etc/nginx/rigmark-static-security.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    expires -1;
    try_files /index.html =500;
  }

  location = /index.html {
    internal;
    include /etc/nginx/rigmark-static-security.conf;
    expires -1;
  }

  location / {
    # Replace the complete browser path. A proxy_pass URI in the root-prefix
    # location would append the unmatched suffix (for example "products") and
    # accidentally call /api/v1/public-routeproducts.
    rewrite ^ /api/v1/public-route break;
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Forwarded-Proto $rigmark_forwarded_scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    proxy_intercept_errors on;
    # Preserve React's existing NotFoundPage while returning a genuine 404.
    error_page 404 =404 /index.html;
  }
}
