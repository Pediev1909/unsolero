<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f0e9" />
    <meta name="robots" content="index, follow" />
    <!--PAGE_META_START-->
    <meta
      name="description"
      content="Build a software stack around your goals, budget, and the tools you already run, with clear, independent recommendations from UNSOLERO."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="UNSOLERO" />
    <meta
      property="og:title"
      content="UNSOLERO — Build the right software stack"
    />
    <meta
      property="og:description"
      content="Tell us what your business does, what you run, and what you can spend. We'll work out what you actually need."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="og:image" content="https://unsolero.com/images/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:image" content="https://unsolero.com/images/og-default.png" />
    <meta
      name="twitter:title"
      content="UNSOLERO — Build the right software stack"
    />
    <meta
      name="twitter:description"
      content="Independent business software recommendations built around your real constraints."
    />
    <title>UNSOLERO — Build the right software stack</title>
    <!--PAGE_META_END-->
    <!-- Outside the PAGE_META markers on purpose. The server rewrites
         everything between them per route, which was deleting this from every
         page including the homepage, so the site had no WebSite entity at all
         while appearing to declare one. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "UNSOLERO",
        "url": "https://unsolero.com",
        "description": "Independent comparisons of business software, with every price read from the vendor and dated."
      }
    </script>
    <!-- Impact.com site ownership checks. Placed outside the PAGE_META markers
         because the server rewrites everything between them per route, which
         would drop these on every request. The non-standard "value" attribute
         is what their verifier reads; "content" is not accepted.
         Two tokens, because two Impact accounts exist: the first was created
         for the HubSpot application, the second when signing up to the
         Squarespace programme. Their verifier looks for its own value, so
         both being present is correct rather than a leftover. -->
    <meta name="impact-site-verification" value="0d66c9bc-f44e-4572-afba-1d5461fb73c2" />
    <meta name="impact-site-verification" value="19693e55-57aa-4c3f-8024-ec19ce41004b" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
