<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="UNSOLERO">
  <!-- The same layers mark the site header uses, on the charcoal tile it sits
       in there, so the browser tab matches the page it belongs to. Drawn at
       32x32 with the 24-unit glyph inset and scaled, rather than shipping a
       raster icon, so it stays sharp at every tab and bookmark size. -->
