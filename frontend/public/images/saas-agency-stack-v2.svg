<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A matrix of capabilities against three tools, with the rows more than one tool provides marked as duplicated">
  <title>The rows you are paying for twice</title>
  <style>
    .ground { fill: #f4f5f7 }
    .colrule{ stroke: #d2d6dd; stroke-width: 1 }
    .rowrule{ stroke: #d2d6dd; stroke-width: 1 }
    .head   { stroke: #14171c; stroke-width: 2.5; stroke-linecap: round }
    .has    { fill: #545b67 }
    .dupdot { fill: #14605a }
    .band   { fill: #14605a; fill-opacity: .10 }
    .bandln { stroke: #14605a; stroke-width: 1.5 }
    .axis   { stroke: #14171c; stroke-width: 2; stroke-linecap: round }

    /* The duplicated rows are the finding, so they are the only thing that
       moves: one slow, low-amplitude wash. Everything else stays still. */
    .band { animation: flag 4.5s ease-in-out infinite }
    .band:nth-of-type(2) { animation-delay: .9s }
    @keyframes flag { 0%,100% { fill-opacity: .10 } 50% { fill-opacity: .22 } }
    @media (prefers-reduced-motion: reduce) { .band { animation: none } }
  </style>

  <rect class="ground" width="1200" height="630"/>

  <!-- Three tools across, seven capabilities down. A dot means the tool
       provides that capability; two dots on a row means it is bought twice. -->
  <g class="rowrule">
    <line x1="250" y1="200" x2="950" y2="200"/>
    <line x1="250" y1="255" x2="950" y2="255"/>
    <line x1="250" y1="310" x2="950" y2="310"/>
    <line x1="250" y1="365" x2="950" y2="365"/>
    <line x1="250" y1="420" x2="950" y2="420"/>
    <line x1="250" y1="475" x2="950" y2="475"/>
  </g>

  <!-- Duplicated rows, washed. -->
  <rect class="band" x="250" y="228" width="700" height="54"/>
  <rect class="band" x="250" y="393" width="700" height="54"/>
  <line class="bandln" x1="250" y1="228" x2="950" y2="228"/>
  <line class="bandln" x1="250" y1="282" x2="950" y2="282"/>
  <line class="bandln" x1="250" y1="393" x2="950" y2="393"/>
  <line class="bandln" x1="250" y1="447" x2="950" y2="447"/>

  <line class="axis" x1="250" y1="170" x2="250" y2="505"/>

  <!-- Column heads: three tools, drawn as marks rather than labels so the
       diagram carries no text to translate. -->
  <g class="head">
    <line x1="390" y1="150" x2="450" y2="150"/>
    <line x1="570" y1="150" x2="630" y2="150"/>
    <line x1="750" y1="150" x2="810" y2="150"/>
  </g>
  <g class="colrule">
    <line x1="420" y1="170" x2="420" y2="505"/>
    <line x1="600" y1="170" x2="600" y2="505"/>
    <line x1="780" y1="170" x2="780" y2="505"/>
  </g>

  <!-- Row 1: one provider. -->
  <circle class="has" cx="420" cy="200" r="9"/>
  <!-- Row 2: duplicated. -->
  <circle class="dupdot" cx="420" cy="255" r="9"/>
  <circle class="dupdot" cx="600" cy="255" r="9"/>
  <!-- Row 3: one provider. -->
  <circle class="has" cx="780" cy="310" r="9"/>
  <!-- Row 4: one provider. -->
  <circle class="has" cx="600" cy="365" r="9"/>
  <!-- Row 5: duplicated, three times. -->
  <circle class="dupdot" cx="420" cy="420" r="9"/>
  <circle class="dupdot" cx="600" cy="420" r="9"/>
  <circle class="dupdot" cx="780" cy="420" r="9"/>
  <!-- Row 6: one provider. -->
  <circle class="has" cx="780" cy="475" r="9"/>
</svg>
