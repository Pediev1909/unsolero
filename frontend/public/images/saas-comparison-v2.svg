<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Two candidates scored against the same five criteria, one path resolving ahead of the other">
  <title>Same criteria, different result</title>
  <style>
    .ground { fill: #f4f5f7 }
    .rule   { stroke: #d2d6dd; stroke-width: 1 }
    .tick   { stroke: #d2d6dd; stroke-width: 1 }
    .lost   { fill: none; stroke: #545b67; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; opacity: .45 }
    .won    { fill: none; stroke: #14605a; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round }
    .node-l { fill: #f4f5f7; stroke: #545b67; stroke-width: 2; opacity: .55 }
    .node-w { fill: #14605a; stroke: #14605a; stroke-width: 2 }
    .axis   { stroke: #14171c; stroke-width: 2; stroke-linecap: round }

    /* One authored moment: the winning path draws itself, once. Its resting
       state is complete, so disabling motion leaves the finished diagram. */
    .won { stroke-dasharray: 620; stroke-dashoffset: 0; animation: draw 1.5s cubic-bezier(.16,1,.3,1) both }
    .node-w { animation: settle .5s cubic-bezier(.16,1,.3,1) both }
    .node-w:nth-of-type(1) { animation-delay: .5s }
    .node-w:nth-of-type(2) { animation-delay: .7s }
    .node-w:nth-of-type(3) { animation-delay: .9s }
    .node-w:nth-of-type(4) { animation-delay: 1.1s }
    .node-w:nth-of-type(5) { animation-delay: 1.3s }
    @keyframes draw   { from { stroke-dashoffset: 620 } to { stroke-dashoffset: 0 } }
    @keyframes settle { from { r: 0 } to { r: 7 } }
    @media (prefers-reduced-motion: reduce) {
      .won, .node-w { animation: none }
    }
  </style>

  <rect class="ground" width="1200" height="630"/>

  <!-- Five criteria rows. The grid is the point: both candidates are measured
       on the same lines, which is what makes the comparison mean anything. -->
  <g class="rule">
    <line x1="300" y1="150" x2="900" y2="150"/>
    <line x1="300" y1="240" x2="900" y2="240"/>
    <line x1="300" y1="330" x2="900" y2="330"/>
    <line x1="300" y1="420" x2="900" y2="420"/>
    <line x1="300" y1="510" x2="900" y2="510"/>
  </g>

  <!-- Scale ticks, quarter intervals -->
  <g class="tick">
    <line x1="450" y1="130" x2="450" y2="530"/>
    <line x1="600" y1="130" x2="600" y2="530"/>
    <line x1="750" y1="130" x2="750" y2="530"/>
  </g>

  <line class="axis" x1="300" y1="120" x2="300" y2="540"/>

  <!-- The rejected candidate: measured, plotted, and behind on three of five. -->
  <polyline class="lost" points="510,150 435,240 600,330 480,420 555,510"/>
  <g>
    <circle class="node-l" cx="510" cy="150" r="6"/>
    <circle class="node-l" cx="435" cy="240" r="6"/>
    <circle class="node-l" cx="600" cy="330" r="6"/>
    <circle class="node-l" cx="480" cy="420" r="6"/>
    <circle class="node-l" cx="555" cy="510" r="6"/>
  </g>

  <!-- The chosen candidate. -->
  <polyline class="won" points="690,150 780,240 660,330 825,420 735,510"/>
  <circle class="node-w" cx="690" cy="150" r="7"/>
  <circle class="node-w" cx="780" cy="240" r="7"/>
  <circle class="node-w" cx="660" cy="330" r="7"/>
  <circle class="node-w" cx="825" cy="420" r="7"/>
  <circle class="node-w" cx="735" cy="510" r="7"/>
</svg>
