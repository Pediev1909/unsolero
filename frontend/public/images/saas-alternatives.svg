<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Monthly cost per tool, with one bar exchanged for a cheaper alternative and the saving bracketed">
  <title>Exchange one, and the total moves</title>
  <style>
    .ground  { fill: #f4f5f7 }
    .grid    { stroke: #d2d6dd; stroke-width: 1 }
    .axis    { stroke: #14171c; stroke-width: 2; stroke-linecap: round }
    .bar     { fill: #545b67 }
    .vacated { fill: none; stroke: #545b67; stroke-width: 1.5; stroke-dasharray: 6 6; opacity: .55 }
    .swap    { fill: #14605a }
    .bracket { fill: none; stroke: #14605a; stroke-width: 2; stroke-linecap: round }
    .totalq  { fill: #d2d6dd }
    .total   { fill: #14171c }

    /* The replacement arrives and the total follows it. One moment, once. */
    .swap  { animation: arrive 1s cubic-bezier(.16,1,.3,1) both; animation-delay: .3s }
    .total { animation: settle 1.2s cubic-bezier(.16,1,.3,1) both; animation-delay: .5s }
    .bracket { stroke-dasharray: 260; animation: mark .8s cubic-bezier(.16,1,.3,1) both; animation-delay: 1.1s }
    @keyframes arrive { from { width: 0 } to { width: 170px } }
    @keyframes settle { from { width: 720px } to { width: 498px } }
    @keyframes mark   { from { stroke-dashoffset: 260 } to { stroke-dashoffset: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .swap, .total, .bracket { animation: none }
    }
  </style>

  <rect class="ground" width="1200" height="630"/>

  <!-- Cost scale. The bars are money, so they share one baseline and one grid. -->
  <g class="grid">
    <line x1="420" y1="120" x2="420" y2="430"/>
    <line x1="600" y1="120" x2="600" y2="430"/>
    <line x1="780" y1="120" x2="780" y2="430"/>
    <line x1="960" y1="120" x2="960" y2="430"/>
  </g>
  <line class="axis" x1="240" y1="120" x2="240" y2="430"/>

  <!-- Four line items. Third is the one being exchanged. -->
  <rect class="bar" x="240" y="146" width="470" height="26" rx="13"/>
  <rect class="bar" x="240" y="216" width="286" height="26" rx="13"/>

  <rect class="vacated" x="240" y="286" width="392" height="26" rx="13"/>
  <rect class="swap"    x="240" y="286" width="170" height="26" rx="13"/>

  <rect class="bar" x="240" y="356" width="214" height="26" rx="13"/>

  <!-- The saving, bracketed between what it was and what it becomes. -->
  <path class="bracket" d="M410 330 V344 H632 V330"/>

  <!-- Total, before and after, on the same baseline as everything above. -->
  <line class="grid" x1="240" y1="480" x2="960" y2="480"/>
  <rect class="totalq" x="240" y="510" width="720" height="30" rx="15"/>
  <rect class="total"  x="240" y="510" width="498" height="30" rx="15"/>
</svg>
