name: Security gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  source-and-secret-scans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Deterministic high-confidence secret patterns
        run: sh scripts/check-secret-patterns.sh
      - name: Unsafe browser sink review
        run: sh scripts/check-unsafe-web-sinks.sh
      - name: Secret history scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
      - name: Install pinned Semgrep CLI
        run: python -m pip install semgrep==1.130.0
      - name: SAST
        run: semgrep scan --config p/default --error --metrics=off
      - name: Filesystem vulnerability and misconfiguration scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: '1'

  image-and-sbom:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: api
            context: backend
            target: api
          - role: worker
            context: backend
            target: worker
          - role: migrate
            context: backend
            target: migrate
          - role: media-reconcile
            context: backend
            target: media-reconcile
          - role: media-init
            context: backend
            target: media-init
          - role: web
            context: frontend
            target: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require pinned Docker base images
        run: sh scripts/check-docker-base-digests.sh backend/Dockerfile frontend/Dockerfile compose.yaml
      - name: Build deployable image
        run: docker build --target ${{ matrix.target }} --tag unsolero-${{ matrix.role }}:${{ github.sha }} ${{ matrix.context }}
      - name: Scan deployable image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: unsolero-${{ matrix.role }}:${{ github.sha }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Generate image SBOM
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          image: unsolero-${{ matrix.role }}:${{ github.sha }}
          format: spdx-json
          output-file: unsolero-${{ matrix.role }}.spdx.json
          artifact-name: unsolero-${{ matrix.role }}-sbom
