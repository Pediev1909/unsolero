name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run budget:check
      - run: npm audit --omit=dev --audit-level=high

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: unsolero_ci
          POSTGRES_USER: unsolero_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unsolero_ci -d unsolero_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: development
      DATABASE_URL: postgres://unsolero_ci:ci-only-password@localhost:5432/unsolero_ci?sslmode=disable
      TEST_DATABASE_URL: postgres://unsolero_ci:ci-only-password@localhost:5432/unsolero_ci?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/0
      TEST_S3_ENDPOINT: localhost:9000
      TEST_S3_ACCESS_KEY: unsolero-ci
      TEST_S3_SECRET_KEY: ci-only-storage-password
      TEST_S3_SECURE: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go mod download
      - run: go mod verify
      - name: Start isolated Redis and S3-compatible dependencies
        run: |
          docker run --detach --name unsolero-ci-redis --publish 6379:6379 \
            redis:7.4-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
          docker run --detach --name unsolero-ci-minio --publish 9000:9000 \
            --env MINIO_ROOT_USER="$TEST_S3_ACCESS_KEY" \
            --env MINIO_ROOT_PASSWORD="$TEST_S3_SECRET_KEY" \
            minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:9000/minio/health/ready && break
            if [ "$attempt" -eq 30 ]; then exit 1; fi
            sleep 1
          done
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Migrate fresh database
        run: go run ./cmd/migrate
      - name: Prove seed idempotency
        run: go run ./cmd/seed && go run ./cmd/seed
      # Integration packages share this one disposable database and some tests
      # deliberately mutate demo commerce state. Serialize packages to prevent
      # cross-package fixture races while retaining in-package concurrency tests.
      - run: go test -p 1 -count=1 ./...
      - run: go test -race -p 1 -count=1 ./...
      - run: go vet ./...
      - run: go build ./...
      - name: Go vulnerability analysis
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  local-stack-and-browser:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    env:
      POSTGRES_DB: unsolero_system
      POSTGRES_USER: unsolero_system
      POSTGRES_PASSWORD: ci-only-password
      API_PORT: 8080
      WEB_PORT: 5173
      APP_VERSION: ci-${{ github.sha }}
      # Playwright's Vite server is the browser origin. State-changing API
      # requests deliberately require an exact origin match.
      PUBLIC_SITE_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d postgres migrate
      - run: docker compose --profile tools run --rm seed
      - run: docker compose --profile tools run --rm seed
      - run: docker compose up -d api commerce-worker
      - name: Verify readiness
        run: curl --fail --retry 20 --retry-delay 2 --retry-all-errors http://127.0.0.1:8080/api/v1/health/ready
      - run: npm --prefix frontend ci
      - run: npx --prefix frontend playwright install --with-deps chromium
      - name: Browser and accessibility tests
        run: npm --prefix frontend run test:e2e
      - name: Graceful service stop
        run: docker compose stop -t 15 api commerce-worker
      - name: Diagnostic logs
        if: failure()
        run: docker compose logs --no-color
      - name: Teardown
        if: always()
        run: docker compose down
